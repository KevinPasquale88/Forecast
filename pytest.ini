[pytest]
; The project has no package structure (no __init__.py anywhere, capitolo 10.1 of the manual):
; every module is imported by bare name from the project root. `pythonpath = .` puts that root
; on sys.path for the test session, so `from embedding import ...` etc. resolve the same way they
; do when main.py itself imports them, regardless of the directory pytest is invoked from.
pythonpath = .
testpaths = tests
